<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292A3E"/>
      <stop offset="100%" stop-color="#1E1E2E"/>
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0883E"/>
      <stop offset="100%" stop-color="#D97327"/>
    </linearGradient>

    <!-- Equals Button Gradient -->
    <linearGradient id="equalsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF7D"/>
      <stop offset="100%" stop-color="#3B9366"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Body -->
  <rect x="48" y="32" width="416" height="448" rx="48" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Border -->
  <rect x="48" y="32" width="416" height="448" rx="48" fill="none" stroke="#45465E" stroke-width="4"/>

  <!-- Screen Display -->
  <rect x="80" y="72" width="352" height="96" rx="16" fill="#20212F"/>
  <rect x="80" y="72" width="352" height="96" rx="16" fill="none" stroke="#3A3B52" stroke-width="2"/>
  
  <!-- Screen Text Placeholder -->
  <text x="408" y="136" font-family="Segoe UI, sans-serif" font-size="38" font-weight="600" fill="#F4F4F8" text-anchor="end">sin(x)</text>

  <!-- Keypad Grid (Simplified Visual Presentation for Store Icons) -->
  <!-- Row 1 -->
  <rect x="80" y="196" width="72" height="52" rx="12" fill="url(#accentGrad)"/>
  <text x="116" y="231" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Shift</text>

  <rect x="173" y="196" width="72" height="52" rx="12" fill="#4B4D6B"/>
  <text x="209" y="231" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#F4F4F8" text-anchor="middle">C</text>

  <rect x="266" y="196" width="72" height="52" rx="12" fill="#4B4D6B"/>
  <text x="302" y="231" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#F4F4F8" text-anchor="middle">⌫</text>

  <rect x="360" y="196" width="72" height="52" rx="12" fill="url(#accentGrad)"/>
  <text x="396" y="231" font-family="Segoe UI, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">÷</text>

  <!-- Row 2 -->
  <rect x="80" y="264" width="72" height="52" rx="12" fill="#4B4D6B"/>
  <text x="116" y="299" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#F4F4F8" text-anchor="middle">√x</text>

  <rect x="173" y="264" width="72" height="52" rx="12" fill="#3A3B52"/>
  <text x="209" y="299" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#F4F4F8" text-anchor="middle">7</text>

  <rect x="266" y="264" width="72" height="52" rx="12" fill="#3A3B52"/>
  <text x="302" y="299" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#F4F4F8" text-anchor="middle">8</text>

  <rect x="360" y="264" width="72" height="52" rx="12" fill="url(#accentGrad)"/>
  <text x="396" y="299" font-family="Segoe UI, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">×</text>

  <!-- Row 3 -->
  <rect x="80" y="332" width="72" height="52" rx="12" fill="#4B4D6B"/>
  <text x="116" y="367" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#F4F4F8" text-anchor="middle">f(x)</text>

  <rect x="173" y="332" width="72" height="52" rx="12" fill="#3A3B52"/>
  <text x="209" y="367" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#F4F4F8" text-anchor="middle">4</text>

  <rect x="266" y="332" width="72" height="52" rx="12" fill="#3A3B52"/>
  <text x="302" y="367" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#F4F4F8" text-anchor="middle">5</text>

  <rect x="360" y="332" width="72" height="52" rx="12" fill="url(#accentGrad)"/>
  <text x="396" y="367" font-family="Segoe UI, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">-</text>

  <!-- Row 4 -->
  <rect x="80" y="400" width="72" height="52" rx="12" fill="#4B4D6B"/>
  <text x="116" y="435" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#F4F4F8" text-anchor="middle">π</text>

  <rect x="173" y="400" width="72" height="52" rx="12" fill="#3A3B52"/>
  <text x="209" y="435" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#F4F4F8" text-anchor="middle">0</text>

  <rect x="266" y="400" width="72" height="52" rx="12" fill="url(#equalsGrad)"/>
  <text x="302" y="435" font-family="Segoe UI, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">=</text>

  <rect x="360" y="400" width="72" height="52" rx="12" fill="url(#accentGrad)"/>
  <text x="396" y="435" font-family="Segoe UI, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">+</text>
</svg>
