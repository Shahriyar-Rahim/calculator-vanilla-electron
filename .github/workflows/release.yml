name: Continuous Integration & Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Job 1: Build Binaries on Linux, Windows, and macOS
  build-multiplatform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App Installers
        run: npm run make

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          prerelease: ${{ contains(github.ref, '-beta') }}
          files: |
            out/make/deb/x64/*.deb
            out/make/zip/linux/x64/*.zip
            out/make/squirrel.windows/x64/*.exe
            out/make/zip/win32/x64/*.zip
            out/make/dmg/x64/*.dmg
            out/make/zip/darwin/x64/*.zip
            out/make/zip/darwin/arm64/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Snap Store Publication
  publish-snap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Unpackaged Linux Executable
        run: npm run package-linux

      - name: Install Snapcraft
        run: |
          sudo snap install snapcraft --classic

      - name: Build Snap Package
        id: build_snap
        run: |
          sudo snapcraft clean
          sudo snapcraft pack --destructive-mode
          # Find the exact .snap file generated and set it as a step output
          SNAP_FILE=$(ls *.snap | head -n 1)
          echo "snap_file=$SNAP_FILE" >> $GITHUB_OUTPUT

      - name: Upload to Canonical Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build_snap.outputs.snap_file }}
          release: ${{ contains(github.ref, '-beta') && 'beta' || 'stable' }}