<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="appp">
      <div class="top-bar">
        <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
          🌙
        </button>
        <span class="angle-mode" id="angleMode">DEG</span>
        <button id="muteToggle" class="icon-btn" title="Mute">🔇</button>
        <button id="historyToggle" class="icon-btn" title="History">🕙</button>
      </div>

      <div class="display">
        <div class="prev-operand" id="prevOperand"></div>
        <div class="current-operand" id="currentOperand">0</div>
      </div>

      <div class="keypad">
        <button class="btn function" data-action="clear">C</button>
        <button class="btn function" data-action="deg-rad">DEG</button>
        <button class="btn function" data-action="sqrt">√x</button>
        <button class="btn operator" data-action="divide">÷</button>
        <button class="btn function" data-action="square">x²</button>
        <button class="btn function" data-action="power">x^y</button>
        <button class="btn function" data-action="log">log</button>
        <button class="btn operator" data-action="multiply">x</button>

        <button class="btn number" data-number="4">4</button>
        <button class="btn number" data-number="5">5</button>
        <button class="btn number" data-number="6">6</button>
        <button class="btn operator" data-action="add">+</button>
        <button class="btn number" data-number="1">1</button>
        <button class="btn number" data-number="2">2</button>
        <button class="btn number" data-number="3">3</button>
        <button class="btn function" data-action="sin">sin</button>
        <button class="btn number zero" data-number="0">0</button>
        <button class="btn number" data-number=".">.</button>
        <button class="btn function" data-action="cos">cos</button>
        <button class="btn function" data-action="tan">tan</button>
        <button class="btn function" data-action="pi">π</button>
        <button class="btn function" data-action="copy">copy</button>
        <button class="btn equals" data-action="equals">=</button>
      </div>
    </div>
    <div class="history-panel" id="historyPanel">
        <div class="history-header">
            <span>History</span>
            <button id="closeHistory" class="icon-btn">x</button>
        </div>

        <div class="history-list" id="historyList"></div>
        <button >Clear History</button>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
